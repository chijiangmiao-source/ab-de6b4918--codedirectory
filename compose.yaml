name: seal-audit

services:
  app:
    build: .
    image: seal-audit:latest
    environment:
      PORT: 8080
      AUDIT_STORE_DIR: /data
    ports:
      # 宿主机端口可通过 PORT 环境变量配置，例如 PORT=9090 docker compose up app
      - "${PORT:-8080}:8080"
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: seal-audit:latest
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app:8080
    command: ["sh", "/srv/verify.sh"]

volumes:
  audit-data:
